<div [ngStyle]="containerStyle" class="timeline-container">
  <!-- Render background rows for each list -->

  @for (layer of visibleLayers; track layer.id) {
  <div class="list-row" [style.top]="$index * layerHeight + 'px'">
    <div class="list-label">Layer {{ $index + 1 }}</div>
  </div>
  }

  <!-- Render draggable items -->
  @for (layer of visibleLayers; track layer.id;let index=$index) { @for (clip of layer.clips;
  track clip.id) {
  <app-clip
    [timeLine]="timeLine"
    [clip]="clip"
    [distancePerTime]="distancePerTime"
    [layerHeight]="layerHeight"
    [layerIndex]="index"
    [visibleLayers]="visibleLayers"
  ></app-clip>
  } }
</div>
